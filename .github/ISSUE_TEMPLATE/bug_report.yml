name: 🐛 Bug Report
description: File a bug report to help us improve
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Thanks for taking the time to report this bug. Please fill out the information below to help us understand and resolve the issue.

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: What browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Browser Version
      description: What version of the browser?
      options:
        - Latest
        - Previous
        - Older
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "Describe the bug here..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Recordings
      description: If applicable, add screenshots or screen recordings to help explain your problem.
      placeholder: "Drag and drop or paste image here..."

  - type: textarea
    id: console
    attributes:
      label: Browser Console Errors
      description: |
        Please paste any relevant errors from the browser console here.
        (Press F12 or Cmd+Option+I to open developer tools)
      placeholder: "Paste console errors here..."

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: "Any other information..."
